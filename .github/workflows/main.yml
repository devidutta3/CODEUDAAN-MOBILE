
name: Build CodeUdaan APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept licenses and install SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Verify Android project
        run: |
          pwd
          ls -la
          test -f settings.gradle || test -f settings.gradle.kts
          test -d app

      - name: Build CodeUdaan APK
        run: gradle --no-daemon assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "APK not found!"
            find . -type f -name "*.apk" -print
            exit 1
          fi
          ls -lh "$APK_PATH"

      - name: Upload generated APK
        uses: actions/upload-artifact@v4
        with:
          name: CodeUdaan-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
