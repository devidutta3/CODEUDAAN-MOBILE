
name: Build CodeUdaan Mobile APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK Packages
        shell: bash
        run: |
          set -e

          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"

          if [ -z "$SDK_ROOT" ]; then
            echo "ERROR: Android SDK path was not found."
            exit 1
          fi

          echo "Android SDK: $SDK_ROOT"

          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" \
            -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1)"

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager was not found."
            exit 1
          fi

          echo "Using sdkmanager: $SDKMANAGER"

          set +o pipefail
          yes | "$SDKMANAGER" --licenses
          LICENSE_STATUS=$?
          set -o pipefail

          if [ "$LICENSE_STATUS" -ne 0 ]; then
            echo "Checking SDK licenses again..."
            "$SDKMANAGER" --licenses
          fi

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Verify Project Files
        shell: bash
        run: |
          set -e

          if [ ! -f "gradlew" ] && [ ! -f "build.gradle" ] && [ ! -f "build.gradle.kts" ]; then
            echo "ERROR: Gradle project files were not found in the repository root."
            exit 1
          fi

          if [ ! -d "app" ]; then
            echo "ERROR: app directory was not found."
            exit 1
          fi

          echo "Project files found."
          ls -la

      - name: Make Gradle Wrapper Executable
        if: ${{ hashFiles('gradlew') != '' }}
        run: chmod +x gradlew

      - name: Build Debug APK
        env:
          GRADLE_OPTS: "-Xmx2048m -XX:MaxMetaspaceSize=512m"
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew \
              --no-daemon \
              --max-workers=2 \
              --stacktrace \
              assembleDebug
          else
            gradle \
              --no-daemon \
              --max-workers=2 \
              --stacktrace \
              assembleDebug
          fi

      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK_PATH="app/build/outputs/apk/debug"

          if [ ! -d "$APK_PATH" ]; then
            echo "ERROR: Debug APK output directory not found."
            exit 1
          fi

          find "$APK_PATH" -maxdepth 1 -type f -name "*.apk" -print

          if ! find "$APK_PATH" -maxdepth 1 -type f -name "*.apk" | grep -q .; then
            echo "ERROR: No APK was generated."
            exit 1
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CodeUdaan-Mobile-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
