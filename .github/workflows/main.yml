
      - name: Verify APK
        shell: bash
        run: |
          set -e
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK_PATH" ]; then
            echo "ERROR: APK was not generated at $APK_PATH"
            echo "Searching for generated APK files..."
            find . -type f -name "*.apk" -print
            exit 1
          fi

          ls -lh "$APK_PATH"

      - name: Upload generated APK
        uses: actions/upload-artifact@v4
        with:
          name: CodeUdaan-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
