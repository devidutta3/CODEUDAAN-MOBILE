
name: Build CodeUdaan Mobile APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK Packages
        shell: bash
        run: |
          set -e

          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"

          if [ -z "$SDK_ROOT" ]; then
            echo "ERROR: Android SDK path was not found."
            exit 1
          fi

          echo "Android SDK: $SDK_ROOT"

          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" \
            -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1)"

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager was not found."
            exit 1
          fi

          echo "Using sdkmanager: $SDKMANAGER"

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Build Debug APK
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CodeUdaan-Mobile-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
